[env:m5stack-dial]
; Pinned: unpinned "espressif32" resolves to whatever platform is installed
; locally (a pioarduino core-3 platform breaks the Dial build)
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TWAI_ISR_IN_IRAM=y
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DFS_MAX_OPEN_FILES=10
    -I.
    
; Library dependencies
lib_deps = 
    m5stack/M5Unified@^0.1.16
    m5stack/M5GFX@^0.1.16
    madhephaestus/ESP32Encoder@^0.11.6
    mathertel/OneButton@^2.5.0
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.3.11
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    kikuchan98/pngle@^1.0.2
    ; BLE is bundled with the ESP32 Arduino core — no extra lib_dep needed.
    ; If the build cannot find BLEDevice.h, uncomment the line below:
    ; nkolban/ESP32 BLE Arduino@^1.0.1
    
; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Build settings
build_type = release
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 8388

; NOTE: This M5Stack Dial hardware variant ships WITHOUT PSRAM.
; Confirmed on two units: PSRAM ID read returns 0x00ffffff (no chip present).
; Do NOT add -DBOARD_HAS_PSRAM or board_build.arduino.memory_type — both
; cause boot-time PSRAM init errors and provide no benefit. The firmware
; runs entirely from the ~320KB internal SRAM. Large allocations (logo
; splash buffer, web responses) must be kept small to fit internal heap.

; ============================================================================
; ESP32-2432S028 "Cheap Yellow Display" (classic ESP32, 4MB flash, 320x240
; resistive touch). Selected in code with -DBOARD_CYD; see include/BoardCYD.h.
;   cyd      - original single-USB board (ILI9341 panel)
;   cyd2usb  - micro-USB + USB-C board (ST7789 panel)
; ============================================================================
[cyd_common]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
build_flags =
    -DBOARD_CYD
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_TWAI_ISR_IN_IRAM=y
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DFS_MAX_OPEN_FILES=10
    -I.
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    mathertel/OneButton@^2.5.0
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.3.11
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    kikuchan98/pngle@^1.0.2
; The bundled MFRC522 fork talks to the Dial's built-in reader through M5Unified
lib_ignore = MFRC522

[env:cyd]
extends = cyd_common
build_flags =
    ${cyd_common.build_flags}
    -DCYD_PANEL_ILI9341
upload_speed = 460800
monitor_speed = 115200
build_type = release
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs

[env:cyd2usb]
extends = cyd_common
build_flags =
    ${cyd_common.build_flags}
    -DCYD_PANEL_ST7789
upload_speed = 460800
monitor_speed = 115200
build_type = release
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
